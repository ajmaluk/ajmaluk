<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 385" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Obsidian Noir) -->
    <linearGradient id="cred_cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080102" />
      <stop offset="50%" stop-color="#140205" />
      <stop offset="100%" stop-color="#080102" />
    </linearGradient>

    <!-- Breathing Radial Neon Red Glow -->
    <radialGradient id="cred_cardGlow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#EF1103">
        <animate attributeName="stop-opacity" values="0.28;0.48;0.28" dur="4.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="70%" stop-color="#6B050B">
        <animate attributeName="stop-opacity" values="0.08;0.18;0.08" dur="4.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#080102" stop-opacity="0" />
    </radialGradient>

    <!-- Divider Laser Shimmer -->
    <linearGradient id="cred_laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A060C" stop-opacity="0" />
      <stop offset="25%" stop-color="#EF1103" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="75%" stop-color="#FF1E27" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4A060C" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cred_cardGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#4A060C" stroke-width="0.6" stroke-opacity="0.45" />
      <circle cx="0" cy="0" r="0.9" fill="#FF1E27" fill-opacity="0.45" />
    </pattern>

    <!-- Bloom Filter -->
    <filter id="cred_badgeBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Card Frame -->
  <rect width="600" height="385" rx="14" fill="url(#cred_cardBg)" stroke="#4A060C" stroke-width="1.8" />
  <rect width="600" height="385" rx="14" fill="url(#cred_cardGlow)" pointer-events="none" />
  <rect width="600" height="385" rx="14" fill="url(#cred_cardGrid)" />

  <!-- Corner Brackets (Electric Red with subtle bloom) -->
  <g stroke="#FF1E27" stroke-width="1.6" fill="none" opacity="0.9" filter="url(#cred_badgeBloom)">
    <path d="M 16 30 L 16 16 L 30 16" />
    <path d="M 584 30 L 584 16 L 570 16" />
    <path d="M 16 355 L 16 369 L 30 369" />
    <path d="M 584 355 L 584 369 L 570 369" />
  </g>

  <!-- Central Shield / Verification Emblem -->
  <g transform="translate(300, 105)">
    <!-- Expanding Hexagonal Ripple Wave -->
    <polygon points="0,-48 41,-24 41,24 0,48 -41,24 -41,-24" fill="none" stroke="#FF1E27" stroke-width="1.2" opacity="0.6">
      <animate attributeName="transform" type="scale" values="1;1.22;1" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0;0.7" dur="3s" repeatCount="indefinite" />
    </polygon>

    <!-- Outer Hexagon / Shield -->
    <polygon points="0,-45 38,-22 38,22 0,45 -38,22 -38,-22" fill="#140205" stroke="#EF1103" stroke-width="2" />
    
    <!-- Rotating Dashed Hexagon 1 (Clockwise) -->
    <polygon points="0,-36 30,-17 30,17 0,36 -30,17 -30,-17" fill="none" stroke="#FF1E27" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite" />
    </polygon>

    <!-- Rotating Dashed Hexagon 2 (Counter-Clockwise) -->
    <polygon points="0,-27 23,-12 23,12 0,27 -23,12 -23,-12" fill="none" stroke="#EF1103" stroke-width="1" stroke-dasharray="3 3" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite" />
    </polygon>

    <!-- Checkmark Icon with Bloom Filter -->
    <path d="M -12 2 L -4 10 L 14 -8" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#cred_badgeBloom)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Headline Titles -->
  <text x="300" y="195" text-anchor="middle" class="sans" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
    VERIFIED CREDENTIAL ARCHIVE
  </text>
  <text x="300" y="222" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#FF4D5E" letter-spacing="1.5">
    7 OFFICIAL INDUSTRY CERTIFICATIONS
  </text>

  <!-- Divider Track & Moving Shimmer Laser -->
  <rect x="180" y="240" width="240" height="1.6" fill="#4A060C" />
  <rect width="120" height="2" y="240" fill="url(#cred_laserGrad)">
    <animate attributeName="x" values="180;300" dur="2.6s" repeatCount="indefinite" />
  </rect>

  <!-- Partner Logo Chips -->
  <g transform="translate(60, 268)">
    <!-- Oracle -->
    <rect x="0" y="0" width="105" height="26" rx="4" fill="#140205" stroke="#4A060C" stroke-width="1" />
    <text x="52.5" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#FFFFFF">Oracle AI</text>

    <!-- Google Cloud -->
    <rect x="120" y="0" width="115" height="26" rx="4" fill="#140205" stroke="#4A060C" stroke-width="1" />
    <text x="177.5" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#FFFFFF">Google Cloud</text>

    <!-- Microsoft -->
    <rect x="250" y="0" width="105" height="26" rx="4" fill="#140205" stroke="#4A060C" stroke-width="1" />
    <text x="302.5" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#FFFFFF">Microsoft</text>

    <!-- IBM & Deloitte -->
    <rect x="370" y="0" width="110" height="26" rx="4" fill="#140205" stroke="#4A060C" stroke-width="1" />
    <text x="425" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#FFFFFF">IBM • Deloitte</text>
  </g>

  <!-- Subtitle Summary -->
  <text x="300" y="328" text-anchor="middle" class="sans" font-size="12.5" font-weight="400" fill="#FFA3AD" opacity="0.95">
    Autonomous AI Agents • Cloud Infrastructure • Prompt Engineering • Software Architecture
  </text>
</svg>
