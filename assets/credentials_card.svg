<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 385" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Midnight to Dark Wine) -->
    <linearGradient id="cred_cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10070C" />
      <stop offset="50%" stop-color="#190B12" />
      <stop offset="100%" stop-color="#10070C" />
    </linearGradient>

    <!-- Radial Glow -->
    <radialGradient id="cred_cardGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.32" />
      <stop offset="70%" stop-color="#451126" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
    </radialGradient>

    <!-- Shimmer Line -->
    <linearGradient id="cred_cardShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0" />
      <stop offset="50%" stop-color="#C77B9B" stop-opacity="1" />
      <stop offset="100%" stop-color="#451126" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cred_cardGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#451126" stroke-width="0.6" stroke-opacity="0.45" />
      <circle cx="0" cy="0" r="0.9" fill="#C77B9B" fill-opacity="0.4" />
    </pattern>

    <!-- Bloom Filter -->
    <filter id="cred_badgeBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Card Frame -->
  <rect width="600" height="385" rx="14" fill="url(#cred_cardBg)" stroke="#451126" stroke-width="1.8" />
  <rect width="600" height="385" rx="14" fill="url(#cred_cardGlow)" pointer-events="none" />
  <rect width="600" height="385" rx="14" fill="url(#cred_cardGrid)" />

  <!-- Corner Brackets -->
  <g stroke="#C77B9B" stroke-width="1.6" fill="none" opacity="0.85">
    <path d="M 16 30 L 16 16 L 30 16" />
    <path d="M 584 30 L 584 16 L 570 16" />
    <path d="M 16 355 L 16 369 L 30 369" />
    <path d="M 584 355 L 584 369 L 570 369" />
  </g>

  <!-- Central Shield / Verification Emblem -->
  <g transform="translate(300, 105)">
    <!-- Outer Hexagon / Shield -->
    <polygon points="0,-45 38,-22 38,22 0,45 -38,22 -38,-22" fill="#190B12" stroke="#701A3D" stroke-width="2" />
    <!-- Inner Pulsing Hexagon -->
    <polygon points="0,-36 30,-17 30,17 0,36 -30,17 -30,-17" fill="none" stroke="#C77B9B" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.75">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite" />
    </polygon>
    <!-- Checkmark Icon -->
    <path d="M -12 2 L -4 10 L 14 -8" fill="none" stroke="#F8F0F3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#cred_badgeBloom)" />
  </g>

  <!-- Headline Titles -->
  <text x="300" y="195" text-anchor="middle" class="sans" font-size="20" font-weight="800" fill="#F8F0F3" letter-spacing="0.5">
    VERIFIED CREDENTIAL ARCHIVE
  </text>
  <text x="300" y="222" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#E5B5C7" letter-spacing="1.5">
    7 OFFICIAL INDUSTRY CERTIFICATIONS
  </text>

  <!-- Divider Line -->
  <rect x="180" y="240" width="240" height="1.5" fill="url(#cred_cardShimmer)" />

  <!-- Partner Logo Chips -->
  <g transform="translate(60, 268)">
    <!-- Oracle -->
    <rect x="0" y="0" width="105" height="26" rx="4" fill="#190B12" stroke="#451126" stroke-width="1" />
    <text x="52.5" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#F8F0F3">Oracle AI</text>

    <!-- Google Cloud -->
    <rect x="120" y="0" width="115" height="26" rx="4" fill="#190B12" stroke="#451126" stroke-width="1" />
    <text x="177.5" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#F8F0F3">Google Cloud</text>

    <!-- Microsoft -->
    <rect x="250" y="0" width="105" height="26" rx="4" fill="#190B12" stroke="#451126" stroke-width="1" />
    <text x="302.5" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#F8F0F3">Microsoft</text>

    <!-- IBM & Deloitte -->
    <rect x="370" y="0" width="110" height="26" rx="4" fill="#190B12" stroke="#451126" stroke-width="1" />
    <text x="425" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#F8F0F3">IBM • Deloitte</text>
  </g>

  <!-- Subtitle Summary -->
  <text x="300" y="328" text-anchor="middle" class="sans" font-size="12.5" font-weight="400" fill="#C77B9B" opacity="0.95">
    Autonomous AI Agents • Cloud Infrastructure • Prompt Engineering • Software Architecture
  </text>
</svg>
