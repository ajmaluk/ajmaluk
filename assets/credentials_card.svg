<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 385" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090203" />
      <stop offset="50%" stop-color="#140407" />
      <stop offset="100%" stop-color="#090203" />
    </linearGradient>

    <!-- Radial Glow -->
    <radialGradient id="cardGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#800010" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#090203" stop-opacity="0" />
    </radialGradient>

    <!-- Shimmer Line -->
    <linearGradient id="cardShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5C0B14" stop-opacity="0" />
      <stop offset="50%" stop-color="#FF1E42" stop-opacity="1" />
      <stop offset="100%" stop-color="#5C0B14" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cardGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#5C0B14" stroke-width="0.6" stroke-opacity="0.4" />
      <circle cx="0" cy="0" r="0.8" fill="#FF1E42" fill-opacity="0.5" />
    </pattern>

    <!-- Bloom Filter -->
    <filter id="badgeBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Card Frame -->
  <rect width="600" height="385" rx="14" fill="url(#cardBg)" stroke="#5C0B14" stroke-width="1.8" />
  <rect width="600" height="385" rx="14" fill="url(#cardGlow)" pointer-events="none" />
  <rect width="600" height="385" rx="14" fill="url(#cardGrid)" />

  <!-- Corner Brackets -->
  <g stroke="#FF1E42" stroke-width="1.6" fill="none" opacity="0.8">
    <path d="M 16 30 L 16 16 L 30 16" />
    <path d="M 584 30 L 584 16 L 570 16" />
    <path d="M 16 355 L 16 369 L 30 369" />
    <path d="M 584 355 L 584 369 L 570 369" />
  </g>

  <!-- Central Shield / Verification Emblem -->
  <g transform="translate(300, 105)">
    <!-- Outer Hexagon / Shield -->
    <polygon points="0,-45 38,-22 38,22 0,45 -38,22 -38,-22" fill="#140407" stroke="#E50914" stroke-width="2" />
    <!-- Inner Pulsing Hexagon -->
    <polygon points="0,-36 30,-17 30,17 0,36 -30,17 -30,-17" fill="none" stroke="#FF1E42" stroke-width="1" stroke-dasharray="4 4" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite" />
    </polygon>
    <!-- Checkmark / Star Icon -->
    <path d="M -12 2 L -4 10 L 14 -8" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#badgeBloom)" />
  </g>

  <!-- Headline Titles -->
  <text x="300" y="195" text-anchor="middle" class="sans" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
    VERIFIED CREDENTIAL ARCHIVE
  </text>
  <text x="300" y="222" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#FF4D6D" letter-spacing="1.5">
    7 OFFICIAL INDUSTRY CERTIFICATIONS
  </text>

  <!-- Divider Line -->
  <rect x="180" y="240" width="240" height="1.5" fill="url(#cardShimmer)" />

  <!-- Partner Logo Chips -->
  <g transform="translate(60, 268)">
    <!-- Oracle -->
    <rect x="0" y="0" width="105" height="26" rx="4" fill="#140407" stroke="#800010" stroke-width="1" />
    <text x="52.5" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#FFF0F3">Oracle AI</text>

    <!-- Google Cloud -->
    <rect x="120" y="0" width="115" height="26" rx="4" fill="#140407" stroke="#800010" stroke-width="1" />
    <text x="177.5" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#FFF0F3">Google Cloud</text>

    <!-- Microsoft -->
    <rect x="250" y="0" width="105" height="26" rx="4" fill="#140407" stroke="#800010" stroke-width="1" />
    <text x="302.5" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#FFF0F3">Microsoft</text>

    <!-- IBM & Deloitte -->
    <rect x="370" y="0" width="110" height="26" rx="4" fill="#140407" stroke="#800010" stroke-width="1" />
    <text x="425" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#FFF0F3">IBM • Deloitte</text>
  </g>

  <!-- Subtitle Summary -->
  <text x="300" y="328" text-anchor="middle" class="sans" font-size="12.5" font-weight="400" fill="#FFA3B1" opacity="0.9">
    Autonomous AI Agents • Cloud Infrastructure • Prompt Engineering • Software Architecture
  </text>
  <text x="300" y="352" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#800010" letter-spacing="1">
    ALL CREDENTIALS PERMANENTLY STORED IN REPOSITORY
  </text>
</svg>
