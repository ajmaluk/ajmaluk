<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Obsidian Noir to Deep Crimson Core) -->
    <linearGradient id="hero_bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080102" />
      <stop offset="45%" stop-color="#140205" />
      <stop offset="85%" stop-color="#0D0103" />
      <stop offset="100%" stop-color="#080102" />
    </linearGradient>

    <!-- Drifting Living Atmospheric Neon Red Nebula 1 -->
    <radialGradient id="hero_redGlow1" cx="22%" cy="30%" r="65%">
      <animate attributeName="cx" values="18%;32%;18%" dur="10s" repeatCount="indefinite" />
      <animate attributeName="cy" values="22%;40%;22%" dur="12s" repeatCount="indefinite" />
      <stop offset="0%" stop-color="#EF1103">
        <animate attributeName="stop-opacity" values="0.32;0.58;0.32" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#8A0910">
        <animate attributeName="stop-opacity" values="0.12;0.26;0.12" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#080102" stop-opacity="0" />
    </radialGradient>

    <!-- Drifting Living Atmospheric Neon Red Nebula 2 -->
    <radialGradient id="hero_redGlow2" cx="85%" cy="70%" r="60%">
      <animate attributeName="cx" values="88%;74%;88%" dur="11s" repeatCount="indefinite" />
      <animate attributeName="cy" values="72%;55%;72%" dur="9s" repeatCount="indefinite" />
      <stop offset="0%" stop-color="#FF1E27">
        <animate attributeName="stop-opacity" values="0.26;0.50;0.26" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="45%" stop-color="#6B050B">
        <animate attributeName="stop-opacity" values="0.10;0.24;0.10" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#080102" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Perimeter Orbiting Laser Gradient -->
    <linearGradient id="hero_borderLaser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A060C" stop-opacity="0" />
      <stop offset="30%" stop-color="#EF1103" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="70%" stop-color="#FF1E27" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#4A060C" stop-opacity="0" />
    </linearGradient>

    <!-- Cyber Matrix Scanline Sweep -->
    <linearGradient id="hero_scanlineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF1103" stop-opacity="0" />
      <stop offset="15%" stop-color="#FF1E27" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.75" />
      <stop offset="85%" stop-color="#FF1E27" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#EF1103" stop-opacity="0" />
    </linearGradient>

    <!-- Glowing Underline Laser Shimmer -->
    <linearGradient id="hero_laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A060C" stop-opacity="0" />
      <stop offset="25%" stop-color="#EF1103" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="75%" stop-color="#FF1E27" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4A060C" stop-opacity="0" />
    </linearGradient>

    <!-- Animated Shimmering Title Gradient -->
    <linearGradient id="hero_titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FFF0F2">
        <animate attributeName="stop-color" values="#FFF0F2;#FFFFFF;#FFCCD3;#FFF0F2" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" stop-color="#FFB8C2">
        <animate attributeName="stop-color" values="#FFB8C2;#FFF0F2;#FFFFFF;#FFB8C2" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#FFA3AF" />
    </linearGradient>

    <!-- Fine Crimson Cyber Grid Pattern -->
    <pattern id="hero_techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#4A060C" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="0" cy="0" r="1.1" fill="#FF1E27" fill-opacity="0.45" />
    </pattern>

    <!-- Neon Red Bloom Filter -->
    <filter id="hero_redBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="hero_glowIntense" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="2.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Primary Flow Wave -->
    <linearGradient id="hero_flowGradient1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A060C" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#FF1E27" stop-opacity="0.75">
        <animate attributeName="stop-color" values="#FF1E27;#EF1103;#FF3B4D;#FF1E27" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#4A060C" stop-opacity="0.05" />
    </linearGradient>

    <!-- Secondary Reverse Flow Wave -->
    <linearGradient id="hero_flowGradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1E27" stop-opacity="0" />
      <stop offset="50%" stop-color="#EF1103" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FF1E27" stop-opacity="0" />
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="hero_radarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E27" stop-opacity="0.38" />
      <stop offset="70%" stop-color="#EF1103" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#080102" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
  </style>

  <!-- Base Obsidian Canvas -->
  <rect width="940" height="330" rx="16" fill="url(#hero_bgGrad)" stroke="#4A060C" stroke-width="1.6" />

  <!-- Animated Living Drifting Neon Red Nebula Glows -->
  <rect width="940" height="330" rx="16" fill="url(#hero_redGlow1)" pointer-events="none" />
  <rect width="940" height="330" rx="16" fill="url(#hero_redGlow2)" pointer-events="none" />

  <!-- Fine Technical Grid -->
  <rect width="940" height="330" rx="16" fill="url(#hero_techGrid)" />

  <!-- Animated Cyber Scanline Traveling Vertically across the Full Background -->
  <g opacity="0.35">
    <rect x="0" y="0" width="940" height="2" fill="url(#hero_scanlineGrad)">
      <animate attributeName="y" values="0;330" dur="4.2s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Floating Ambient Cyber Particles across the Background -->
  <g filter="url(#hero_redBloom)">
    <!-- Particle 1 -->
    <circle cx="120" cy="90" r="1.6" fill="#FF1E27">
      <animate attributeName="cy" values="90;70;90" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite" />
    </circle>
    <!-- Particle 2 -->
    <circle cx="270" cy="220" r="1.9" fill="#FFFFFF">
      <animate attributeName="cx" values="270;290;270" dur="7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="4s" repeatCount="indefinite" />
    </circle>
    <!-- Particle 3 -->
    <circle cx="480" cy="50" r="1.8" fill="#FF1E27">
      <animate attributeName="cy" values="50;65;50" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0.15;0.9" dur="3.6s" repeatCount="indefinite" />
    </circle>
    <!-- Particle 4 -->
    <circle cx="620" cy="280" r="2" fill="#EF1103">
      <animate attributeName="cx" values="620;600;620" dur="8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.15;0.95;0.15" dur="3.2s" repeatCount="indefinite" />
    </circle>
    <!-- Particle 5 -->
    <circle cx="390" cy="290" r="1.7" fill="#FF1E27">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <!-- Particle 6 -->
    <circle cx="710" cy="70" r="1.5" fill="#FFFFFF">
      <animate attributeName="opacity" values="0.1;0.85;0.1" dur="2.9s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Animated Orbiting Perimeter Laser around the ENTIRE Hero Banner (Cleanly insets by 2px to avoid border clipping) -->
  <rect x="2" y="2" width="936" height="326" rx="15" fill="none" stroke="url(#hero_borderLaser)" stroke-width="2" stroke-dasharray="260 2260" filter="url(#hero_redBloom)">
    <animate attributeName="stroke-dashoffset" values="0;-2520" dur="5.5s" repeatCount="indefinite" />
  </rect>

  <!-- Precision Corner HUD Brackets (Electric Neon Red with pulse) -->
  <g stroke="#FF1E27" stroke-width="2" fill="none" opacity="0.9" filter="url(#hero_redBloom)">
    <path d="M 18 36 L 18 18 L 36 18" />
    <path d="M 922 36 L 922 18 L 904 18" />
    <path d="M 18 294 L 18 312 L 36 312" />
    <path d="M 922 294 L 922 312 L 904 312" />
  </g>

  <!-- Dual Animated Flow Vectors Across Canvas -->
  <path d="M 50 160 Q 230 110, 430 170 T 820 135" fill="none" stroke="url(#hero_flowGradient1)" stroke-width="2" stroke-dasharray="10 8" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="0;240" dur="10s" repeatCount="indefinite" />
  </path>
  <path d="M 80 205 Q 280 255, 520 195 T 860 215" fill="none" stroke="url(#hero_flowGradient2)" stroke-width="1.4" stroke-dasharray="6 10" opacity="0.45">
    <animate attributeName="stroke-dashoffset" values="240;0" dur="14s" repeatCount="indefinite" />
  </path>

  <!-- Right-side Orbital HUD Geometry (Cleanly placed at x=792, y=165) -->
  <g transform="translate(792, 165)" opacity="0.95">
    <!-- Rotating Radar Sector Scan Beam -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7.5s" repeatCount="indefinite" />
      <path d="M 0 0 L 68 -28 A 74 74 0 0 1 74 0 Z" fill="url(#hero_radarGradient)" />
      <line x1="0" y1="0" x2="74" y2="0" stroke="#FF1E27" stroke-width="1.4" opacity="0.85" />
    </g>

    <!-- Outer Dashed Orbit (Clockwise) -->
    <circle r="92" fill="none" stroke="#5C080F" stroke-width="1.2" stroke-dasharray="6 8" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="36s" repeatCount="indefinite" />
    </circle>
    
    <!-- Middle Orbit (Glowing Red Halo - Counter-Clockwise) -->
    <circle r="68" fill="none" stroke="#FF1E27" stroke-width="1.8" stroke-dasharray="12 14" opacity="0.85" filter="url(#hero_redBloom)">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite" />
    </circle>

    <!-- Expanding Sonic Shockwave Pulse from Halo -->
    <circle r="68" fill="none" stroke="#EF1103" stroke-width="1.4" opacity="0.6">
      <animate attributeName="r" values="68;100;68" dur="3.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;0;0.6" dur="3.6s" repeatCount="indefinite" />
    </circle>

    <!-- Inner Core & Crosshair Ring -->
    <circle r="42" fill="none" stroke="#EF1103" stroke-width="1.1" stroke-dasharray="4 6" opacity="0.7" />
    <circle r="17" fill="#140205" stroke="#FF1E27" stroke-width="2" />
    
    <!-- Central Pulsing Star Core -->
    <circle r="6.5" fill="#FFFFFF" filter="url(#hero_glowIntense)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="r" values="5.5;7.5;5.5" dur="1.8s" repeatCount="indefinite" />
    </circle>

    <!-- Orbiting Satellite Node 1 (Fast Orbit) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
      <circle cx="68" cy="0" r="4.5" fill="#FF1E27" filter="url(#hero_glowIntense)" />
      <circle cx="68" cy="0" r="1.5" fill="#FFFFFF" />
    </g>

    <!-- Orbiting Satellite Node 2 (Medium Orbit) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="18s" repeatCount="indefinite" />
      <circle cx="92" cy="0" r="3.5" fill="#EF1103" filter="url(#hero_redBloom)" />
    </g>

    <!-- Crosshair Alignment Lines -->
    <line x1="-106" y1="0" x2="106" y2="0" stroke="#4A060C" stroke-width="0.8" opacity="0.6" />
    <line x1="0" y1="-106" x2="0" y2="106" stroke="#4A060C" stroke-width="0.8" opacity="0.6" />
  </g>

  <!-- Left Technical Accents / Plus Markers -->
  <g stroke="#FF1E27" stroke-width="1.2" opacity="0.7" filter="url(#hero_redBloom)">
    <path d="M 45 38 L 45 50 M 39 44 L 51 44" />
    <path d="M 45 282 L 45 294 M 39 288 L 51 288" />
    <path d="M 890 38 L 890 50 M 884 44 L 896 44" />
  </g>

  <!-- Top Status Badge Pill -->
  <g transform="translate(56, 40)">
    <rect width="384" height="28" rx="14" fill="#140205" stroke="#6B050B" stroke-width="1.3" />
    <!-- Triple Ring Active Sonar Beacon -->
    <circle cx="16" cy="14" r="4.5" fill="#FF1E27" filter="url(#hero_glowIntense)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="16" cy="14" r="8" fill="none" stroke="#FF1E27" stroke-width="1" opacity="0.6">
      <animate attributeName="r" values="4;12;4" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="18.5" fill="#FFF0F2" class="mono" font-size="11" font-weight="700" letter-spacing="1.5">
      FOUNDER @ UTHAKKAN • AI &amp; FULL-STACK
    </text>
  </g>

  <!-- Main Headline: Name with Dynamic Shimmer -->
  <g transform="translate(56, 126)">
    <text class="sans" font-size="42" font-weight="850" fill="url(#hero_titleGrad)" letter-spacing="-0.5">
      MUHAMMED AJMAL U K
    </text>
  </g>

  <!-- Animated Glowing Red Laser Underline -->
  <g transform="translate(56, 144)">
    <!-- Base track -->
    <rect width="520" height="2" fill="#4A060C" />
    <!-- Laser beam shimmer traveling smoothly -->
    <rect width="240" height="3" fill="url(#hero_laserGrad)">
      <animate attributeName="x" values="-240;520" dur="2.8s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Role & Positioning -->
  <g transform="translate(56, 182)">
    <text class="sans" font-size="16.5" font-weight="600" fill="#FF4D5E" letter-spacing="0.2">
      AI/ML Engineer • Full-Stack Developer • Creative Technologist
    </text>
    <text class="sans" y="24" font-size="13.5" font-weight="400" fill="#FFA3AD" opacity="0.95">
      MCA Student @ CET Trivandrum • Architecting Autonomous Agents, Web Systems &amp; Mobile Ecosystems.
    </text>
  </g>

  <!-- Curated Tech Focus Badges (Obsidian & Electric Red Palette, cleanly separated from radar) -->
  <g transform="translate(56, 254)">
    <!-- Badge 1: Autonomous AI Agents -->
    <g transform="translate(0, 0)">
      <rect width="156" height="28" rx="6" fill="#140205" stroke="#4A060C" stroke-width="1.2" />
      <circle cx="14" cy="14" r="3.5" fill="#FF1E27">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="24" y="18" fill="#FFFFFF" class="mono" font-size="10" font-weight="600">Autonomous AI Agents</text>
    </g>

    <!-- Badge 2: Full-Stack & APIs -->
    <g transform="translate(166, 0)">
      <rect width="144" height="28" rx="6" fill="#140205" stroke="#4A060C" stroke-width="1.2" />
      <circle cx="14" cy="14" r="3.5" fill="#EF1103">
        <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="24" y="18" fill="#FFFFFF" class="mono" font-size="10" font-weight="600">Full-Stack &amp; APIs</text>
    </g>

    <!-- Badge 3: Flutter & Mobile -->
    <g transform="translate(320, 0)">
      <rect width="142" height="28" rx="6" fill="#140205" stroke="#4A060C" stroke-width="1.2" />
      <circle cx="14" cy="14" r="3.5" fill="#FF3B4D">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite" />
      </circle>
      <text x="24" y="18" fill="#FFFFFF" class="mono" font-size="10" font-weight="600">Flutter &amp; Mobile</text>
    </g>

    <!-- Badge 4: Cloud & Architecture -->
    <g transform="translate(472, 0)">
      <rect width="162" height="28" rx="6" fill="#140205" stroke="#4A060C" stroke-width="1.2" />
      <circle cx="14" cy="14" r="3.5" fill="#FF1E27">
        <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.2s" repeatCount="indefinite" />
      </circle>
      <text x="24" y="18" fill="#FFFFFF" class="mono" font-size="10" font-weight="600">Cloud &amp; Architecture</text>
    </g>
  </g>

  <!-- Bottom-Right Clean Telemetry HUD (Zero Text Overlap, Layered rows) -->
  <g transform="translate(906, 280)">
    <!-- Row 1: Telemetry status & ECG waveform -->
    <g>
      <!-- Telemetry Status Beacon -->
      <circle cx="-188" cy="0" r="2.5" fill="#FF1E27" filter="url(#hero_redBloom)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.3s" repeatCount="indefinite" />
      </circle>
      <text x="-180" y="2.5" class="mono" font-size="8.5" font-weight="600" fill="#FFA3AD" letter-spacing="1">
        SYS PULSE
      </text>

      <!-- ECG Waveform (Cleanly isolated, zero text collision) -->
      <path d="M -110 0 L -90 0 L -84 -8 L -78 7 L -72 -7 L -66 2 L -60 0 L 0 0" stroke="#FF1E27" stroke-width="1.3" fill="none" opacity="0.85" filter="url(#hero_redBloom)" />
      
      <!-- Animated Traveling Glow Node on ECG -->
      <circle cy="0" r="2.2" fill="#FFFFFF" filter="url(#hero_glowIntense)">
        <animate attributeName="cx" values="-110;0" dur="2.2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;1;1;0" dur="2.2s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Row 2: Clean Coordinate Text below (Completely unobstructed) -->
    <text text-anchor="end" x="0" y="24" fill="#FF4D5E" class="mono" font-size="9" font-weight="600" letter-spacing="1.4" opacity="0.95">
      08°32'N 76°54'E // CET TRIVANDRUM
    </text>
  </g>
</svg>
