<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Obsidian to Crimson Noir) -->
    <linearGradient id="redBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090203" />
      <stop offset="50%" stop-color="#140407" />
      <stop offset="100%" stop-color="#080102" />
    </linearGradient>

    <!-- Crimson Energy Glows -->
    <radialGradient id="crimsonGlow1" cx="18%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#800010" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#090203" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="crimsonGlow2" cx="88%" cy="75%" r="60%">
      <stop offset="0%" stop-color="#FF1E42" stop-opacity="0.34" />
      <stop offset="50%" stop-color="#5C0B14" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#090203" stop-opacity="0" />
    </radialGradient>

    <!-- Laser Underline Shimmer -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#800010" stop-opacity="0" />
      <stop offset="30%" stop-color="#E50914" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="70%" stop-color="#FF1E42" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#5C0B14" stop-opacity="0" />
    </linearGradient>

    <!-- Text Highlight Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#FFF0F3" />
      <stop offset="100%" stop-color="#FFA3B1" />
    </linearGradient>

    <!-- Fine Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#5C0B14" stroke-width="0.7" stroke-opacity="0.45" />
      <circle cx="0" cy="0" r="1" fill="#FF1E42" fill-opacity="0.6" />
    </pattern>

    <!-- Soft Bloom Filter -->
    <filter id="crimsonBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
  </style>

  <!-- Base Dark Canvas -->
  <rect width="940" height="330" rx="16" fill="url(#redBgGrad)" stroke="#5C0B14" stroke-width="1.6" />

  <!-- Ambient Crimson Atmospheric Glows -->
  <rect width="940" height="330" rx="16" fill="url(#crimsonGlow1)" pointer-events="none" />
  <rect width="940" height="330" rx="16" fill="url(#crimsonGlow2)" pointer-events="none" />

  <!-- Cyber Grid -->
  <rect width="940" height="330" rx="16" fill="url(#cyberGrid)" />

  <!-- Precision Corner HUD Brackets -->
  <g stroke="#FF1E42" stroke-width="2" fill="none" opacity="0.85">
    <path d="M 18 36 L 18 18 L 36 18" />
    <path d="M 922 36 L 922 18 L 904 18" />
    <path d="M 18 294 L 18 312 L 36 312" />
    <path d="M 922 294 L 922 312 L 904 312" />
  </g>

  <!-- Right-side Orbital HUD Rings (Pure Crimson & Ruby) -->
  <g transform="translate(780, 165)" opacity="0.85">
    <!-- Outer Dashed Orbit -->
    <circle r="98" fill="none" stroke="#800010" stroke-width="1.2" stroke-dasharray="6 8" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="45s" repeatCount="indefinite" />
    </circle>
    
    <!-- Middle Orbit -->
    <circle r="70" fill="none" stroke="#FF1E42" stroke-width="1.4" stroke-dasharray="10 14" opacity="0.75">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="28s" repeatCount="indefinite" />
    </circle>

    <!-- Inner Core & Crosshair -->
    <circle r="42" fill="none" stroke="#FF4D6D" stroke-width="1" stroke-dasharray="3 5" opacity="0.65" />
    <circle r="17" fill="#5C0B14" fill-opacity="0.45" stroke="#FF1E42" stroke-width="1.8" />
    <circle r="6" fill="#FFFFFF" filter="url(#crimsonBloom)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite" />
    </circle>

    <!-- Satellite Node 1 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite" />
      <circle cx="70" cy="0" r="4" fill="#FF1E42" filter="url(#crimsonBloom)" />
    </g>

    <!-- Satellite Node 2 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="24s" repeatCount="indefinite" />
      <circle cx="98" cy="0" r="3" fill="#FFA3B1" />
    </g>

    <!-- Crosshair Lines -->
    <line x1="-115" y1="0" x2="115" y2="0" stroke="#5C0B14" stroke-width="0.8" opacity="0.6" />
    <line x1="0" y1="-115" x2="0" y2="115" stroke="#5C0B14" stroke-width="0.8" opacity="0.6" />
  </g>

  <!-- Left Technical Accents & Plus Crosses -->
  <g stroke="#E50914" stroke-width="1.2" opacity="0.65">
    <path d="M 45 38 L 45 50 M 39 44 L 51 44" />
    <path d="M 45 282 L 45 294 M 39 288 L 51 288" />
    <path d="M 890 38 L 890 50 M 884 44 L 896 44" />
  </g>

  <!-- Top Status Badge Pill -->
  <g transform="translate(56, 40)">
    <rect width="368" height="28" rx="14" fill="#140407" stroke="#E50914" stroke-width="1.4" />
    <!-- Blinking Active Status Beacon -->
    <circle cx="16" cy="14" r="4.5" fill="#FF1E42" filter="url(#crimsonBloom)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="16" cy="14" r="8" fill="none" stroke="#FF1E42" stroke-width="0.9" opacity="0.5">
      <animate attributeName="r" values="4;11;4" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0;0.7" dur="1.6s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="18.5" fill="#FFF0F3" class="mono" font-size="11" font-weight="700" letter-spacing="1.5">
      FOUNDER @ UTHAKKAN • AI &amp; FULL-STACK
    </text>
  </g>

  <!-- Main Headline: Name -->
  <g transform="translate(56, 126)">
    <text class="sans" font-size="42" font-weight="850" fill="url(#titleGrad)" letter-spacing="-0.5">
      MUHAMMED AJMAL U K
    </text>
  </g>

  <!-- Animated Laser Glowing Underline -->
  <g transform="translate(56, 144)">
    <!-- Base track -->
    <rect width="520" height="2" fill="#5C0B14" />
    <!-- Laser beam shimmer -->
    <rect width="240" height="3" fill="url(#laserGrad)">
      <animate attributeName="x" values="-240;520" dur="3.4s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Role & Statement -->
  <g transform="translate(56, 182)">
    <text class="sans" font-size="16.5" font-weight="600" fill="#FF4D6D" letter-spacing="0.2">
      AI &amp; Full-Stack Developer • MCA Student @ CET • Digital Product Architect
    </text>
    <text class="sans" y="24" font-size="13.5" font-weight="400" fill="#FFA3B1" opacity="0.95">
      Engineering Autonomous AI Agents, Production Web Platforms &amp; Mobile Ecosystems.
    </text>
  </g>

  <!-- Tech Focus Badges (Ruby & Scarlet Cyber Styling) -->
  <g transform="translate(56, 254)">
    <!-- Badge 1: AI Agents & LLMs -->
    <g transform="translate(0, 0)">
      <rect width="138" height="28" rx="6" fill="#140407" stroke="#800010" stroke-width="1.2" />
      <circle cx="12" cy="14" r="3" fill="#FF1E42" />
      <text x="22" y="18" fill="#FFFFFF" class="mono" font-size="10.5" font-weight="600">AI Agents &amp; LLMs</text>
    </g>

    <!-- Badge 2: Full-Stack Platforms -->
    <g transform="translate(146, 0)">
      <rect width="154" height="28" rx="6" fill="#140407" stroke="#800010" stroke-width="1.2" />
      <circle cx="12" cy="14" r="3" fill="#E50914" />
      <text x="22" y="18" fill="#FFFFFF" class="mono" font-size="10.5" font-weight="600">Full-Stack Platforms</text>
    </g>

    <!-- Badge 3: Flutter & Mobile -->
    <g transform="translate(308, 0)">
      <rect width="134" height="28" rx="6" fill="#140407" stroke="#800010" stroke-width="1.2" />
      <circle cx="12" cy="14" r="3" fill="#FF1E42" />
      <text x="22" y="18" fill="#FFFFFF" class="mono" font-size="10.5" font-weight="600">Flutter &amp; Mobile</text>
    </g>

    <!-- Badge 4: Cloud & Firebase -->
    <g transform="translate(450, 0)">
      <rect width="136" height="28" rx="6" fill="#140407" stroke="#800010" stroke-width="1.2" />
      <circle cx="12" cy="14" r="3" fill="#E50914" />
      <text x="22" y="18" fill="#FFFFFF" class="mono" font-size="10.5" font-weight="600">Cloud &amp; Firebase</text>
    </g>
  </g>

  <!-- Right Telemetry & Coordinates -->
  <g transform="translate(900, 302)">
    <!-- Small ECG waveform -->
    <path d="M -150 -4 L -130 -4 L -124 -11 L -118 6 L -112 -6 L -106 1 L -100 -4 L -80 -4" stroke="#FF1E42" stroke-width="1.2" fill="none" opacity="0.65" />
    <text text-anchor="end" fill="#800010" class="mono" font-size="9" letter-spacing="1.2" opacity="0.85">
      08°32'N 76°54'E // TRIVANDRUM
    </text>
  </g>
</svg>
