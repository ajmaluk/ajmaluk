<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 100" width="100%" height="100%">
  <defs>
    <linearGradient id="footerRedBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090203" />
      <stop offset="50%" stop-color="#140407" />
      <stop offset="100%" stop-color="#090203" />
    </linearGradient>

    <linearGradient id="footerRedLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5C0B14" stop-opacity="0" />
      <stop offset="30%" stop-color="#800010" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FF1E42" stop-opacity="1" />
      <stop offset="70%" stop-color="#800010" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#5C0B14" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Container Box -->
  <rect width="940" height="100" rx="14" fill="url(#footerRedBg)" stroke="#5C0B14" stroke-width="1.4" />

  <!-- Precision Corner HUD Brackets -->
  <g stroke="#FF1E42" stroke-width="1.8" fill="none" opacity="0.75">
    <path d="M 14 26 L 14 14 L 26 14" />
    <path d="M 926 26 L 926 14 L 914 14" />
    <path d="M 14 74 L 14 86 L 26 86" />
    <path d="M 926 74 L 926 86 L 914 86" />
  </g>

  <!-- Top Accent Glowing Crimson Line -->
  <rect x="90" y="0" width="760" height="2" fill="url(#footerRedLine)" />

  <!-- Center Decorative Ruby Diamond -->
  <g transform="translate(470, 32)">
    <polygon points="0,-7 7,0 0,7 -7,0" fill="#FF1E42">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite" />
    </polygon>
    <circle cx="0" cy="0" r="1.8" fill="#FFFFFF" />
  </g>

  <!-- Headline Motto -->
  <text x="470" y="58" text-anchor="middle" class="sans" font-size="14.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">
    Building with Code, Creativity, and Curiosity
  </text>

  <!-- Secondary Metadata Line -->
  <text x="470" y="78" text-anchor="middle" class="mono" font-size="10.5" font-weight="500" fill="#FFA3B1" letter-spacing="1.5">
    DESIGNED &amp; DEVELOPED BY MUHAMMED AJMAL U K • KERALA, INDIA
  </text>
</svg>
