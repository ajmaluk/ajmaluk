<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Dark Wine to Midnight) -->
    <linearGradient id="footer_bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10070C" />
      <stop offset="50%" stop-color="#190B12" />
      <stop offset="100%" stop-color="#10070C" />
    </linearGradient>

    <!-- Glowing Wine Line -->
    <linearGradient id="footer_lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0" />
      <stop offset="30%" stop-color="#701A3D" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#E5B5C7" stop-opacity="1" />
      <stop offset="70%" stop-color="#701A3D" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#451126" stop-opacity="0" />
    </linearGradient>

    <!-- Diamond Bloom -->
    <filter id="footer_diamondBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
  </style>

  <!-- Container Box -->
  <rect width="940" height="100" rx="14" fill="url(#footer_bgGrad)" stroke="#451126" stroke-width="1.4" />

  <!-- Precision Corner HUD Brackets -->
  <g stroke="#C77B9B" stroke-width="1.8" fill="none" opacity="0.75">
    <path d="M 14 26 L 14 14 L 26 14" />
    <path d="M 926 26 L 926 14 L 914 14" />
    <path d="M 14 74 L 14 86 L 26 86" />
    <path d="M 926 74 L 926 86 L 914 86" />
  </g>

  <!-- Top Accent Glowing Burgundy/Wine Line -->
  <rect x="90" y="0" width="760" height="2" fill="url(#footer_lineGrad)" />

  <!-- Center Decorative Rose Diamond -->
  <g transform="translate(470, 32)">
    <polygon points="0,-7 7,0 0,7 -7,0" fill="#C77B9B" filter="url(#footer_diamondBloom)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
    </polygon>
    <circle cx="0" cy="0" r="2" fill="#F8F0F3" />
  </g>

  <!-- Headline Motto -->
  <text x="470" y="58" text-anchor="middle" class="sans" font-size="14.5" font-weight="700" fill="#F8F0F3" letter-spacing="0.5">
    Crafted with Precision, Intent &amp; Architectural Discipline
  </text>

  <!-- Secondary Metadata Line -->
  <text x="470" y="78" text-anchor="middle" class="mono" font-size="10.5" font-weight="500" fill="#E5B5C7" letter-spacing="1.5">
    DESIGNED &amp; DEVELOPED BY MUHAMMED AJMAL U K • KERALA, INDIA
  </text>
</svg>
